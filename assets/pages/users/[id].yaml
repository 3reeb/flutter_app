type: screen

meta:
  title: "User Profile: {{$route.param.id}}"
  description: "View the profile of user {{$route.param.id}}"

# Using the SSR / data-fetching engine
serverProps:
  action: "api.read"
  path: "/api/users/{{$route.param.id}}"
  # In a real app this hits your backend. We'll simulate data via state.

state:
  mockUser:
    name: "Quantum Operative {{$route.param.id}}"
    role: "Engineering"
    status: "Active"
    clearance: 5

ui:
  type: box:col
  style: "w-full p-48 gap-24 align-center"
  children:
    - type: box:col
      style: "glass p-32 radius-16 gap-16 w-400 align-center"
      children:
        - type: text
          props:
            text: "👤"
            style: "size-64"
        
        - type: text:h2
          props:
            text: "{{state.mockUser.name}}"
            style: "color-white weight-800 size-24 text-center"
            
        - type: text
          props:
            text: "User ID: {{$route.param.id}}"
            style: "color-#6366F1 font-mono size-14 text-center"

        - type: box:row
          style: "gap-12 mt-16"
          children:
            - type: action:badge
              props:
                text: "{{state.mockUser.role}}"
                intent: "purple"
            - type: action:badge
              props:
                text: "Level {{state.mockUser.clearance}}"
                intent: "slate"
                fill: "soft"
