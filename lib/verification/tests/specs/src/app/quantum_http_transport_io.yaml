  input:
    preconditions:
    - Load src/app/quantum_http_transport_io.dart with its documented dependencies
      available.
    - Use the runtime surface described in docs/src/app/quantum_http_transport_io.dart.md.
    stimulus:
    - Open a request against success, timeout, offline, and partial-stream paths.
    - Close the transport in both normal and forced shutdown paths.
    data:
