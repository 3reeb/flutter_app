  file: lib/src/app/quantum_http_transport.dart
  docs_file: docs/src/app/quantum_http_transport.dart.md
  title: 'Quantum Http Transport: public contract remains stable under valid input'
  slug: contract
  category: transport
  severity: critical
  description: Verify that quantum http transport keeps its documented runtime behavior
    while handling contract conditions without corruption, leakage, or silent failure.
  input:
    preconditions:
    - Load src/app/quantum_http_transport.dart with its documented dependencies available.
    - Use the runtime surface described in docs/src/app/quantum_http_transport.dart.md.
    stimulus:
    - Open a request against success, timeout, offline, and partial-stream paths.
    - Close the transport in both normal and forced shutdown paths.
    data:
      method: GET/POST/PUT/DELETE edge cases
      payload_profile:
      - empty
      - small json
      - large multipart
      - cancelled stream
  expected_output:
    response: Correct response or structured failure is returned.
    cleanup: Sockets, streams, and request sinks are closed exactly once.
    retry: Retries do not duplicate side effects or leak handles.
  observability:
    logs: No unhandled exceptions, uncaught async errors, or hidden retries.
    metrics: Capture latency, allocations, rebuild count, and cleanup completion.
    traces: Trace the call path through the documented public API and teardown hooks.
  performance_budget:
    max_ms: 100
    stress_ms: 250
  memory_budget:
    max_growth_mb: 2
    leak_check: true
  cleanup:
  - Dispose controllers, streams, painters, or isolates.
  - Verify no retained listeners or stale caches remain.
  docs_parity:
    summary: A small platform-abstracted HTTP transport layer. The shared interface
      lives here, while separate IO and web files provide the concrete client implementation
      selected by conditional import.
    headings:
