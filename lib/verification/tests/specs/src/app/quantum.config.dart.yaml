  title: 'Quantum Config Dart example: public contract remains stable under valid
    input'
  slug: contract
  category: app
  severity: critical
  description: Verify that quantum config dart example keeps its documented runtime
    behavior while handling contract conditions without corruption, leakage, or silent
    failure.
  input:
    preconditions:
    - Load src/app/quantum.config.dart.example with its documented dependencies available.
    - Use the runtime surface described in docs/src/app/quantum.config.dart.example.md.
    stimulus:
    - Start the app shell, navigate across routes, and exercise modal/export flows.
    - Rebuild the shell after state changes and verify the navigation graph stays
      intact.
    data:
      routes:
      - home
      - detail
      - overlay
      - export
      - settings
      lifecycle:
      - startup
      - hot reload
      - background/foreground
      - teardown
  expected_output:
    navigation: Route state and page shell behavior remain correct.
    lifecycle: No lost state or duplicated initialization occurs.
    cleanup: Exports and overlays release resources when dismissed.
  observability:
    logs: No unhandled exceptions, uncaught async errors, or hidden retries.
    metrics: Capture latency, allocations, rebuild count, and cleanup completion.
    traces: Trace the call path through the documented public API and teardown hooks.
  performance_budget:
    max_ms: 100
    stress_ms: 250
  memory_budget:
    max_growth_mb: 1
    leak_check: true
  cleanup:
  - Dispose controllers, streams, painters, or isolates.
  - Verify no retained listeners or stale caches remain.
  docs_parity:
    summary: 'A developer-facing example configuration file. It shows the intended
      shape of the real configuration object and provides stronger default values
      for app, API, security, merge, cache, and source sections. Author-intent note:
      Copy this file to `quantum.config.dart` and edit the single source of truth.'
