__meta:
  id: sdui-runtime-nested-contract
  title: SDUI runtime nested contract
  description: Nested SDUI runtime checks for engine, type export, registry, and JSON test engine helpers.
  tags:
  - sdui
  - runtime
  - nested
  - contract
  - engine
  allowBlank: true
cases:
- id: runtime-nested-root-shape
  title: runtime nested root shape
  sourcePath: test/sdui_json/sdui_runtime_nested_contract.json
  assertions:
  - kind: json_root_keys_contains
    expected:
    - __meta
    - cases
    - groups
  - kind: json_meta_keys_contains
    expected:
    - id
    - title
    - description
    - tags
    - allowBlank
  - kind: json_case_ids_unique
  - kind: json_assertion_kinds_allowed
    values:
    - source_contains_all
    - source_contains_any
    - source_not_contains
    - subtypes_exact
    - subtypes_contains
    - builder_contains
    - line_count_at_least
    - source_sha256_matches
    - snapshot_path_not_empty
    - json_round_trip
    - json_round_trip_strict
    - json_root_keys_contains
    - json_root_keys_exact
    - json_meta_keys_contains
    - json_meta_keys_exact
    - json_case_count_at_least
    - json_case_count_exact
    - json_case_keys_contains
    - json_case_keys_exact
    - json_case_ids_unique
    - json_case_assertions_nonempty
    - json_assertion_kinds_allowed
    - json_path_exists
    - json_path_not_empty
    - json_path_equals
    - json_path_contains_all
    - json_path_contains_any
    - json_path_keys_contains
    - json_path_keys_exact
    - json_path_length_at_least
    - json_path_length_exact
    - json_path_type_is
    - all
    - any
    - not
  - kind: json_path_type_is
    path: groups
    expected:
    - list
  - kind: json_path_length_at_least
    path: groups
    value: 2
  - kind: json_path_keys_contains
    path: groups[0]
    expected:
    - id
    - title
    - description
    - groups
  - kind: json_path_length_at_least
    path: groups[0].groups
    value: 1
  - kind: json_round_trip_strict
- id: runtime-nested-json-runner-contract
  title: json runner nested assertion contract
  sourcePath: test/support/quantum_sdui_json_suite.dart
  assertions:
  - kind: all
    assertions:
    - kind: source_contains_all
      values:
      - QuantumSduiJsonGroup
      - QuantumSduiJsonCase
      - QuantumSduiJsonAssertion
      - _runGroupNode
      - _pathSegments
    - kind: source_contains_all
      values:
      - json_path_exists
      - json_path_not_empty
      - json_path_equals
      - json_path_contains_all
      - json_path_contains_any
      - json_path_keys_contains
      - json_path_keys_exact
      - json_path_length_at_least
      - json_path_length_exact
      - json_path_type_is
  - kind: not
    assertions:
    - kind: source_contains_all
      values:
      - THIS_TOKEN_SHOULD_NEVER_EXIST_IN_THE_RUNNER
- id: runtime-nested-operator-ladder
  title: Runtime nested operator ladder
  sourcePath: src/runtime/quantum_vm.dart
  assertions:
  - kind: all
    assertions:
    - kind: source_contains_all
      values:
      - $define
      - $let
      - $if
      - $repeat
      - $call
      - $switch
    - kind: source_contains_all
      values:
      - $async
      - $stream
      - $machine
      - $portal
      - $try
      - $layout
    - kind: source_contains_all
      values:
      - $compose
      - $apply
      - $scope
      - $spread
      - $parallel
    - kind: source_contains_all
      values:
      - $throttle
      - $debounce
      - $reactive_map
      - $classes
- id: runtime-nested-snapshot-export
  title: Snapshot export stays nested and queryable
  sourcePath: src/runtime/quantum_sdui_type_engine.dart
  assertions:
  - kind: source_contains_all
    values:
    - exportSnapshot
    - exportJson
    - exportTypeScriptBundle
    - exportBundle
  - kind: source_contains_all
    values:
    - includeRegistry
    - includeCoreSchemas
    - includeDesignSystems
    - includeOmniCores
    - includeDslOperators
    - includeAliasRegistry
    - includeOrchestrator
groups:
- id: transport-and-export
  title: Transport and export
  description: Engine, type export, and runtime snapshot checks.
  groups:
  - id: transport-engine
    title: Transport engine
    description: QuantumSduiEngine transport and crypto contract checks.
    rows:
    - id: quantum-sdui-engine-contract
      title: Quantum SDUI engine transport contract
      sourcePath: lib/src/runtime/quantum_sdui_engine.dart
      assertions:
      - kind: all
        assertions:
        - kind: source_contains_all
          values:
          - QuantumSduiException
          - SduiEncryptedPayload
          - SduiKeyStore
          - SduiReplayGuard
          - QuantumSduiEngine
          - QuantumApiEngine
          - QLSduiWidget
        - kind: source_contains_all
          values:
          - AES-256-GCM
          - HMAC-SHA256
          - HKDF-SHA256
          - nonce LRU-bounded Set
          - Lazy blueprint compilation + LRU cache
        - kind: source_not_contains
          values:
          - TODO
          - FIXME
    - id: quantum-sdui-type-engine-contract
      title: Quantum SDUI type export contract
      sourcePath: lib/src/runtime/quantum_sdui_type_engine.dart
      assertions:
      - kind: any
        assertions:
        - kind: source_contains_all
          values:
          - QuantumSduiTypeBundle
          - QuantumSduiTypeEngine
          - exportSnapshot
          - exportJson
          - exportTypeScriptBundle
          - exportBundle
          - omniCores
          - dslOperators
          - aliasRegistry
          - orchestrator
        - kind: builder_contains
          values:
          - exportSnapshot
          - exportJson
      - kind: source_not_contains
        values:
        - todo(
        - FIXME
      - kind: line_count_at_least
        value: 220
  - id: transport-snapshot
    title: Transport snapshot
    description: Snapshot export coverage for the SDUI type engine.
    tests:
    - id: quantum-sdui-type-snapshot-contract
      title: Quantum SDUI type snapshot contract
      sourcePath: lib/src/runtime/quantum_sdui_type_engine.dart
      assertions:
      - kind: snapshot_path_not_empty
        path: omniCores.action.subtypeCount
      - kind: snapshot_path_not_empty
        path: omniCores.visual.fullTypes
      - kind: snapshot_path_not_empty
        path: omniCores.text.subtypes
- id: registry-and-test-engine
  title: Registry and test engine
  description: Registry dispatch and test engine loading checks.
  groups:
  - id: registry-layer
    title: Registry layer
    description: The Omni registry is the runtime router for SDUI subtypes.
    rows:
    - id: quantum-omni-registry-contract
      title: Quantum Omni registry contract
      sourcePath: lib/src/runtime/quantum_omni_registry.dart
      assertions:
      - kind: source_contains_all
        values:
        - QuantumOmniRegistry
        - register
        - resolve
        - dispatch
        - subtype
      - kind: source_not_contains
        values:
        - TODO
        - FIXME
  - id: json-test-engine
    title: JSON test engine
    description: Folder discovery and JSON loading for the dynamic SDUI test engine.
    cases:
    - id: quantum-sdui-test-engine-contract
      title: Quantum SDUI JSON test engine contract
      sourcePath: lib/src/runtime/quantum_sdui_test_engine_io.dart
      assertions:
      - kind: source_contains_all
        values:
        - discoverFolder
        - loadSuite
        - json
        - manifest
        - QuantumSduiJsonSuite
      - kind: source_not_contains
        values:
        - TODO
        - FIXME
    - id: quantum-sdui-test-engine-shared-contract
      title: Quantum SDUI shared test engine contract
      sourcePath: lib/src/runtime/quantum_sdui_test_engine_shared.dart
      assertions:
      - kind: source_contains_all
        values:
        - QuantumSduiTestCase
        - QuantumSduiTestGroup
        - QuantumSduiTestResult
        - QuantumSduiTestReport
      - kind: source_not_contains
        values:
        - TODO
        - FIXME
