__meta:
  id: sdui-json-operators-and-bindings
  title: SDUI JSON operators and bindings
  description: Compile-time operators, binding roots, and runtime bridges.
  tags:
  - sdui
  - json
  - operators
  - bindings
  allowBlank: true
groups:
- id: dsl-operators
  title: Compile-time DSL operators
  cases:
  - id: operator-catalog-completeness
    title: The VM operator catalogue is exhaustive and explicit
    sourcePath: src/runtime/quantum_vm.dart
    assertions:
    - kind: source_contains_all
      values:
      - $define
      - $let
      - $if
      - $repeat
      - $call
      - $switch
      - $async
      - $stream
      - $machine
      - $portal
      - $watch
      - $try
      - $layout
      - $compose
      - $apply
      - $scope
      - $spread
      - $throttle
      - $debounce
      - $parallel
      - $reactive_map
      - $classes
    - kind: source_contains_all
      values:
      - _injectCompileTimeStructurally
      - _expandMacro
      - _macroDefaultProps
      - _macroCallerProps
      - _collectMacroSlots
      - _tokenizeNodeProperties
      - _parseMicroActions
  - id: operator-descriptions-match-purpose
    title: Descriptions remain attached to the operator names
    sourcePath: src/runtime/quantum_vm.dart
    assertions:
    - kind: source_contains_all
      values:
      - Declare compile-time named macros
      - Invoke a previously $define-d macro by name
      - Multi-branch compile-time switch
      - Error boundary shorthand
      - Apply prop/style overrides to all direct children
      - Bind path namespacing
    - kind: source_contains_any
      values:
      - reactive stream subscription binding
      - animated diff list rendering
      - fan-out concurrent children
- id: binding-roots
  title: Binding roots and runtime bridges
  cases:
  - id: binding-roots-remain-supported
    title: State, env, local, and route roots stay addressable
    sourcePath: src/runtime/quantum_vm.dart
    assertions:
    - kind: source_contains_all
      values:
      - $state
      - $env
      - $local
      - $route
      - QLDataBinder.resolveAOT
      - QLDataScope.readNode
    - kind: source_contains_all
      values:
      - read(
      - resolveAOT(
      - bind
      - slot
      - name
      - debugPath
  - id: runtime-bridges-and-transport
    title: Runtime bridge operators cover streams, portals, and machine scopes
    sourcePath: src/runtime/quantum_vm.dart
    assertions:
    - kind: source_contains_all
      values:
      - '__subType'': ''stream'
      - '__subType'': ''machine'
      - '__subType'': ''overlay_entry'
      - '__subType'': ''error_boundary'
      - '__subType'': ''diff'
      - '__subType'': ''repeater'
      - '__subType'': ''store_provider'
    - kind: source_contains_all
      values:
      - system:async
      - portal:overlay_entry
      - data:diff
      - control:machine
      - hook:error_boundary
