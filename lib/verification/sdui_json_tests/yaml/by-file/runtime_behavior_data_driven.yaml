__meta:
  id: sdui-json-runtime-behavior-data-driven
  title: SDUI runtime behavior data-driven suite
  description: Recursive JSON fixtures that compile real SDUI input into exact blueprint snapshots.
  tags:
    - sdui
    - runtime
    - data-driven
    - fixtures
    - snapshots
  allowBlank: true

groups:
  - id: basic-normalization
    title: Basic normalization and metadata
    cases:
      - id: minimal-string
        file: test/generated/sdui_json_runtime_behavior_test/cases/basic/minimal_string.json
        expectedShape: text blueprint
      - id: text-node-with-child
        file: test/generated/sdui_json_runtime_behavior_test/cases/basic/text_node_with_child.json
        expectedShape: text with child path
      - id: row-subtype
        file: test/generated/sdui_json_runtime_behavior_test/cases/basic/row_subtype.json
        expectedShape: box row subtype
      - id: split-guard
        file: test/generated/sdui_json_runtime_behavior_test/cases/basic/split_guard.json
        expectedShape: guarded split subtype
      - id: metadata-preservation
        file: test/generated/sdui_json_runtime_behavior_test/cases/basic/metadata_preservation.json
        expectedShape: metadata and slot preservation
      - id: slot-shorthand
        file: test/generated/sdui_json_runtime_behavior_test/cases/basic/slot_shorthand.json
        expectedShape: shorthand slot extraction

