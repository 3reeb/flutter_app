- name: smoke
  description: basic compile and round-trip sanity
  rows:
  - id: quantum_schema.smoke.001
    purpose: Prove the primary contract of `src/foundation/quantum_schema.dart` can
      be created and exercised with canonical values.
    target_symbols: &id001
    - QLBlockPayload
    - QLSchemaFieldSpec
    - QLSchemaBlueprint
    - QLSchemaCompiler
    - QLSchemaRegistry
    - QLSchemaReadPlan
    - QLSchemaRegistryInspector
