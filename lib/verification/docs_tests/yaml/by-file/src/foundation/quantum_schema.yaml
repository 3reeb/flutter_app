    setup: Build the minimal valid object graph or runtime context required by this
      file.
    input: Canonical values that stay within the most common public-path defaults.
    body: Call the main entry path twice with the same state to verify repeatability
      and reuse.
    expected: The result is stable across repeated calls and no hidden mutation appears.
    assertions:
    - observable output matches the documented contract
    - repeat call returns the same shape
    - no unexpected extra work is visible
    metrics:
    - call count
    - cache hits
    - allocation delta
    risks:
    - silent eager load
    - duplicate side effects
    - state mutation on read
    cleanup: Reset state and clear caches.
  - id: quantum_schema.smoke.002
    purpose: Confirm the file survives the smallest valid payload and the largest
      documented trivial payload.
    target_symbols: *id001
    setup: Prepare one-item and small-batch fixtures.
    input: A single item followed by a short repeated batch.
    body: Execute the same path with one item, then with a small repeated batch.
    expected: Both inputs are handled without shape loss or unexpected divergence.
    assertions:
    - one-item path works
    - batch path works
    - batch does not degrade shape
    metrics:
    - latency
    - allocation count
    risks:
    - off-by-one handling
    - shape drift on repeated values
    cleanup: Reset state and clear caches.
  - id: quantum_schema.smoke.003
    purpose: Ensure the public API does not require hidden global state to produce
      a valid result.
    target_symbols: *id001
    setup: Run in a clean process with no previously initialized caches or registries.
    input: Fresh process state.
    body: Invoke the same contract after process-style reset conditions.
    expected: No hidden singleton is required for success.
