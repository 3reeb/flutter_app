groups:
  - name: registry
    description: registration, lookup, and removal behavior
    rows:
      - id: quantum_vm.registry.001
        purpose: Exercise the `registry` branch under the normal public contract.
        target_symbols: &id001
          - QuantumSecurityException
          - QLSchemaSlice
          - QLLazySchemaView
          - QLModuleAccessPolicy
          - QLModuleRecord
          - QLModuleRegistry
          - QLRegistryEntry
          - QuantumExtensionBundle
        setup: Prepare a realistic fixture with the minimum data needed for this branch.
        input: A focused input that triggers the main branch.
        body: Run the public path for this branch and inspect outputs and side effects.
        expected: The branch behaves deterministically and preserves its explicit invariants.
        assertions:
          - branch-specific invariants hold
        metrics:
          - branch latency
          - side-effect count
        risks:
          - branch drift
          - missing output
        cleanup: Reset state and clear caches.
      - id: quantum_vm.registry.002
        purpose: Check the `registry` branch under a malformed or partial input.
        target_symbols: *id001
        setup: Use incomplete, malformed, or mixed-shape fixtures.
        input: A malformed variant that still reaches the branch.
        body: Run the same branch with the malformed input.
        expected: The branch rejects or normalizes intentionally without silent corruption.
        assertions:
          - branch fails explicitly or normalizes intentionally
        metrics:
          - error localization
        risks:
          - partial mutation
          - silent coercion
        cleanup: Reset state and clear caches.
      - id: quantum_vm.registry.003
        purpose: Re-run the `registry` branch twice to prove stable repeated behavior.
        target_symbols: *id001
        setup: Prime state once, then repeat the same branch.
        input: Repeated identical branch input.
        body: Compare first and second execution results, cache hits, and event order.
        expected: No duplicate side effect appears and the result stays stable.
        assertions:
          - repeatability holds
          - no duplicate side effects
        metrics:
          - repeat latency
          - cache-hit ratio
        risks:
          - double emit
          - stale branch result
        cleanup: Reset state and clear caches.
