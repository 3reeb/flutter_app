          - boundary latency
        risks:
          - mismatched contract
          - boundary state leak
        cleanup: Reset state and clear caches.
      - id: quantum_data_state.integration.002
        purpose: Confirm the integration path handles fallback and partial availability without breaking the caller.
        target_symbols: *id001
        setup: Disable one dependency path and keep at least one alternate route available.
        input: A partially available dependency graph.
        body: Exercise the fallback branch rather than the ideal branch.
        expected: The fallback path remains deterministic and explicit.
