      - id: quantum_data_state.integration.001
        purpose: "Prove `src/runtime/quantum_data_state.dart` cooperates with its imported neighbors: dart:async, dart:collection, dart:typed_data, package:flutter/foundation.dart, package:flutter/material.dart."
