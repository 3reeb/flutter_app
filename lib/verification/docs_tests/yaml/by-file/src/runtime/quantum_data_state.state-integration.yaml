          - fallback selection time
        risks:
          - unexpected hard failure
          - wrong branch selection
        cleanup: Reset state and clear caches.
      - id: quantum_data_state.integration.003
        purpose: Validate that repeated integration calls do not leak state or amplify side effects.
        target_symbols: *id001
        setup: Invoke the same integration flow multiple times under the same fixture.
        input: Repeated identical integration calls.
        body: Run the same cross-file path twice and compare outputs and side effects.
        expected: The second call is not worse than the first and does not allocate or register extra work unless intended.
        assertions:
          - repeatability
          - no duplicate registration
          - no stale state
        metrics:
          - incremental allocations
          - duplicate side-effect count
        risks:
          - listener leaks
          - duplicate registrations
          - stale snapshots
        cleanup: Reset state and clear caches.
