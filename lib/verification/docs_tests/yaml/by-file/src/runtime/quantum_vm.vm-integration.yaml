groups:
  - name: regression
    description: silent permission bypass, stale caches, and token drift
    rows:
      - id: quantum_vm.regression.001
        purpose: Exercise the `regression` branch under the file-specific contract.
        target_symbols: &id001
          - QuantumSecurityException
          - QLSchemaSlice
          - QLLazySchemaView
          - QLModuleAccessPolicy
          - QLModuleRecord
          - QLModuleRegistry
          - QLRegistryEntry
          - QuantumExtensionBundle
        setup: Prepare a realistic fixture that targets this branch.
        input: A representative valid input for the branch.
        body: Run the branch using the public API.
        expected: The output matches the documented contract.
        assertions:
          - branch contract holds
        metrics:
          - latency
        risks:
          - silent mismatch
        cleanup: Reset state and clear caches.
      - id: quantum_vm.regression.002
        purpose: Exercise the `regression` branch with malformed or partial input.
        target_symbols: *id001
        setup: Prepare a malformed or partial variant.
        input: Invalid or incomplete data.
        body: Run the same public API path.
        expected: The branch fails explicitly or normalizes intentionally.
        assertions:
          - failure is explicit
        metrics:
          - error path latency
        risks:
          - silent coercion
        cleanup: Reset state and clear caches.
      - id: quantum_vm.regression.003
        purpose: Repeat the `regression` branch to prove stable behavior.
        target_symbols: *id001
        setup: Prime and repeat the same fixture.
        input: Identical repeated input.
        body: Compare output, side effects, and allocation behavior.
        expected: Repeated execution stays stable and bounded.
        assertions:
          - repeatability
        metrics:
          - repeat latency
        risks:
          - duplicate side effects
        cleanup: Reset state and clear caches.
