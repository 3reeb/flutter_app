groups:
  - name: integration
    description: state/orchestrator handoff
    rows:
      - id: quantum_data_pipeline.integration.001
        purpose: "Prove `src/runtime/quantum_data_pipeline.dart` cooperates with its imported neighbors: dart:async, dart:collection, dart:typed_data, package:flutter/foundation.dart, quantum_data_state.dart."
        target_symbols: &id001
          - QLPrefetchConfig
          - QLAggregateOp
          - QLPipelineDelegate
          - QLDataPipeline
          - QLPipelineRegistry
          - QLDataPipelineReadPlan
          - QLPipelineMode
          - QLExecutionMode
        setup: Stub or pin the neighboring files or adapters that this file imports.
        input: A real cross-file call path using the normal import graph.
        body: Run the public contract end-to-end across the import boundary.
        expected: The outcome matches the same contract when driven by the neighbor file.
        assertions:
          - import boundary stays stable
          - contract survives neighboring-file execution
        metrics:
          - cross-file call count
          - boundary latency
        risks:
          - mismatched contract
          - boundary state leak
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.integration.002
        purpose: Confirm the integration path handles fallback and partial availability without breaking the caller.
        target_symbols: *id001
        setup: Disable one dependency path and keep at least one alternate route available.
        input: A partially available dependency graph.
        body: Exercise the fallback branch rather than the ideal branch.
        expected: The fallback path remains deterministic and explicit.
        assertions:
          - fallback path is reachable
          - partial availability is handled
        metrics:
          - retry count
          - fallback selection time
        risks:
          - unexpected hard failure
          - wrong branch selection
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.integration.003
        purpose: Validate that repeated integration calls do not leak state or amplify side effects.
        target_symbols: *id001
        setup: Invoke the same integration flow multiple times under the same fixture.
        input: Repeated identical integration calls.
        body: Run the same cross-file path twice and compare outputs and side effects.
        expected: The second call is not worse than the first and does not allocate or register extra work unless intended.
        assertions:
          - repeatability
          - no duplicate registration
          - no stale state
        metrics:
          - incremental allocations
          - duplicate side-effect count
        risks:
          - listener leaks
          - duplicate registrations
          - stale snapshots
        cleanup: Reset state and clear caches.
