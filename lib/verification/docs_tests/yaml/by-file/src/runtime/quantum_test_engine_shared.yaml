reusable_presets:
  smoke_base:
    purpose:
      Prove the canonical public path works and stays stable across repeated
      runs.
    assertions:
      - observable result is stable
      - no hidden mutation
      - no duplicate side effects
  edge_base:
    purpose: Prove malformed input fails explicitly or normalizes intentionally.
    assertions:
      - failure is explicit
      - no silent coercion
      - no stale state
  perf_base:
    purpose: Measure the hot path and bound allocations or repeated work.
    assertions:
      - warm path is not worse than cold path
      - allocation growth stays bounded
  integration_base:
    purpose: Validate behavior across local imports and neighboring runtime layers.
    assertions:
      - boundary contract holds
      - cross-file side effects remain stable
groups:
  - name: model-contract
    description: Core data model shape and constructors.
    rows:
      - id: shared.model.001
        purpose: Parse source metadata and preserve line counts, imports, and keywords.
        target_symbols: *id001
        setup: Construct metadata from YAML maps.
        input: source_metadata map.
        body: Deserialize and reserialize the structure.
        expected: All metadata fields round-trip without loss.
        assertions:
          - imports preserved
          - keywords preserved
          - hash preserved
        metrics:
          - round-trip fidelity
        risks:
          - metadata drift
        cleanup: None.
      - id: shared.model.002
        purpose: Parse row and group specifications with the original raw payload attached.
        target_symbols: *id001
        setup: Build a group map with nested rows.
        input: group and row YAML nodes.
        body: Deserialize rows, tags, assertions, and metrics.
        expected: Nested rows are preserved and accessible.
        assertions:
          - rows parsed
          - raw kept
          - ids preserved
        metrics:
          - object count
        risks:
          - shape loss
        cleanup: None.
  - name: validation
    description: Issue recording and strict validation helpers.
    rows:
      - id: shared.validation.001
        purpose: Detect duplicate group names and duplicate row ids.
        target_symbols: *id001
        setup: Load a manifest with deliberate duplicates.
        input: Duplicate names and ids.
        body: Run validation.
        expected: Duplicate issues are recorded with explicit paths.
        assertions:
          - duplicate groups flagged
          - duplicate rows flagged
        metrics:
          - issue count
        risks:
          - silent collisions
        cleanup: Reset issue buffers.
      - id: shared.validation.002
        purpose: Require group names, row ids, and source paths.
        target_symbols: *id001
        setup: Load malformed records missing required fields.
        input: Missing structural fields.
        body: Run strict validation.
        expected: Errors are reported for the missing fields.
        assertions:
          - required fields flagged
          - no false pass
        metrics:
          - validation latency
        risks:
          - invalid manifests passing
        cleanup: None.
  - name: reporting
    description: Result and report serialization.
    rows:
      - id: shared.reporting.001
        purpose: Serialize results in compact form without dumping giant diagnostics.
        target_symbols: *id001
        setup: Populate large detail maps and long strings.
        input: Oversized debug payloads.
        body: Convert to JSON.
        expected: Only important details remain visible.
        assertions:
          - redaction applied
          - identity preserved
        metrics:
          - payload size
        risks:
          - debug noise
        cleanup: Discard temp objects.
      - id: shared.reporting.002
        purpose: Expose pass/fail counts and compact summaries for humans and automation.
        target_symbols: *id001
        setup: Build a mixed report.
        input: Pass/fail result list.
        body: Call the summary formatter.
        expected: The summary is concise and stable.
        assertions:
          - summary stable
          - counts correct
        metrics:
          - summary size
        risks:
          - inconsistent reports
        cleanup: None.
