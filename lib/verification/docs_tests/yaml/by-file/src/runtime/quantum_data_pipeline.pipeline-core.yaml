          - QLAggregateOp
          - QLPipelineDelegate
          - QLDataPipeline
          - QLPipelineRegistry
          - QLDataPipelineReadPlan
          - QLPipelineMode
          - QLExecutionMode
        setup: Stub or pin the neighboring files or adapters that this file imports.
        input: A real cross-file call path using the normal import graph.
        body: Run the public contract end-to-end across the import boundary.
        expected: The outcome matches the same contract when driven by the neighbor file.
        assertions:
          - import boundary stays stable
          - contract survives neighboring-file execution
        metrics:
          - cross-file call count
          - boundary latency
        risks:
          - mismatched contract
          - boundary state leak
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.routing.002
        purpose: Confirm the integration path handles fallback and partial availability without breaking the caller.
        target_symbols: *id001
        setup: Disable one dependency path and keep at least one alternate route available.
        input: A partially available dependency graph.
        body: Exercise the fallback branch rather than the ideal branch.
        expected: The fallback path remains deterministic and explicit.
        assertions:
          - fallback path is reachable
          - partial availability is handled
        metrics:
          - retry count
          - fallback selection time
        risks:
          - unexpected hard failure
          - wrong branch selection
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.routing.003
        purpose: Validate that repeated integration calls do not leak state or amplify side effects.
        target_symbols: *id001
        setup: Invoke the same integration flow multiple times under the same fixture.
        input: Repeated identical integration calls.
        body: Run the same cross-file path twice and compare outputs and side effects.
        expected: The second call is not worse than the first and does not allocate or register extra work unless intended.
        assertions:
          - repeatability
          - no duplicate registration
          - no stale state
        metrics:
          - incremental allocations
          - duplicate side-effect count
        risks:
          - listener leaks
          - duplicate registrations
          - stale snapshots
        cleanup: Reset state and clear caches.
  - name: streaming
    description: batched and streamed execution behavior
    rows:
      - id: quantum_data_pipeline.streaming.001
        purpose: Validate stream handling for `src/runtime/quantum_data_pipeline.dart`.
        target_symbols: &id002
          - QLPrefetchConfig
          - QLAggregateOp
          - QLPipelineDelegate
          - QLDataPipeline
          - QLPipelineRegistry
          - QLDataPipelineReadPlan
          - QLPipelineMode
          - QLExecutionMode
        setup: Prepare a live stream or batched event source.
        input: A small stream followed by a longer stream.
        body: Connect the stream and read emitted states.
        expected: The stream produces the documented sequence and stops cleanly.
        assertions:
          - stream sequence matches contract
        metrics:
          - event throughput
          - subscription count
        risks:
          - missed event
          - duplicate event
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.streaming.002
        purpose: Check cancellation and completion boundaries explicitly.
        target_symbols: *id002
        setup: Open a stream and close it under different timings.
        input: Cancelled and completed stream cases.
        body: Cancel once, complete once, and compare final state.
        expected: Cancellation and completion are distinct and visible.
        assertions:
          - cancel is distinct from completion
        metrics:
          - cancel latency
        risks:
          - leaked subscription
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.streaming.003
        purpose: Confirm backpressure or batching does not hide late data.
        target_symbols: *id002
        setup: Send a burst of values through the stream path.
        input: A burst workload with a late item.
        body: Observe whether the late item is preserved in order.
        expected: Late data is not lost or silently reordered unless explicitly designed.
        assertions:
          - late data is preserved or explicitly documented otherwise
        metrics:
          - burst throughput
        risks:
          - lost tail item
        cleanup: Reset state and clear caches.
  - name: cache
    description: cache-aware pipeline paths and reuse
    rows:
      - id: quantum_data_pipeline.cache.001
        purpose: Profile the hot path for `src/runtime/quantum_data_pipeline.dart` with a large but realistic workload.
        target_symbols: &id003
          - QLPrefetchConfig
          - QLAggregateOp
          - QLPipelineDelegate
          - QLDataPipeline
          - QLPipelineRegistry
          - QLDataPipelineReadPlan
          - QLPipelineMode
          - QLExecutionMode
        setup: Prepare a large input set with stable shape and repeated access patterns.
        input: Large valid dataset and repeated reads.
        body: Measure the primary operation repeatedly and compare cold vs warm behavior.
        expected: Warm-path behavior improves or remains stable, with no hidden quadratic work.
        assertions:
          - warm path is faster or equal
          - no repeated recomputation
        metrics:
          - wall time
          - allocations
          - cache hits
        risks:
          - quadratic scan
          - unbounded copying
          - hidden eager load
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.cache.002
        purpose: Ensure cached or memoized work in `src/runtime/quantum_data_pipeline.dart` is invalidated precisely when input changes.
        target_symbols: *id003
        setup: Prime the cache, then change one field or dependency at a time.
        input: Same input after one controlled mutation.
        body: Read twice, mutate once, then read again.
        expected: Only the changed branch recomputes; unrelated branches stay cached.
        assertions:
          - cache invalidates precisely
          - unrelated work stays reused
        metrics:
          - recompute count
          - cache-hit ratio
        risks:
          - stale cache
          - over-invalidation
        cleanup: Reset state and clear caches.
      - id: quantum_data_pipeline.cache.003
        purpose: Check that lazy materialization only happens on demand and not before the first access boundary.
        target_symbols: *id003
        setup: Prime a lazy fixture without touching the heavy branch.
        input: A handle or metadata-only input before heavy data access.
        body: Inspect the object, then touch the heavy branch once.
        expected: No heavy work occurs before access, and the first access is explicit and measurable.
        assertions:
          - no eager load before access
          - first access triggers exactly one load
        metrics:
          - first-access latency
          - eager-load count
        risks:
          - hidden prefetch
          - double fetch
        cleanup: Reset state and clear caches.
